# Minimal PREVIEW CI — lint/build only.
# Actions billing / entitlement walls may keep this red; do not invent GA claims from CI color.
name: preview-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [draft/platform-scaffold-preview, main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install
        run: npm install
      - name: Lint stub
        run: npm run lint
      - name: Build
        run: npm run build
