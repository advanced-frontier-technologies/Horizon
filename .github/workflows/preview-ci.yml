# Minimal PREVIEW CI — expect Actions billing may still wall; do not treat green/red as Eng Proof.
name: preview-ci

on:
  push:
    branches: [main, "cursor/**", "draft/**"]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
